name: mining-gateway

x-restart: &restart
  restart: unless-stopped

x-security: &security
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: [*restart, *security]
    image: postgres:18.4-bookworm
    profiles: [core]
    environment:
      POSTGRES_DB: mining_gateway
      POSTGRES_USER: mining
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets: [postgres_password]
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mining -d mining_gateway']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    networks: [backend]

  redis:
    <<: [*restart, *security]
    image: redis:8.2.3-alpine
    profiles: [core]
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$(cat /run/secrets/redis_password)"
    secrets: [redis_password]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 640m
    cpus: 1
    networks: [backend]

  caddy:
    <<: [*restart, *security]
    image: caddy:2.10.2-alpine
    profiles: [core]
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-gateway.local}
      ADMIN_UPSTREAM: ${ADMIN_UPSTREAM:-host.docker.internal:3000}
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST:-private_ranges}
    ports:
      - '127.0.0.1:${ADMIN_HTTP_PORT:-8080}:80'
      - '${ADMIN_BIND_IP:-0.0.0.0}:${ADMIN_HTTPS_PORT:-8443}:443'
      - '${ADMIN_BIND_IP:-0.0.0.0}:${ADMIN_HTTPS_PORT:-8443}:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 192m
    cpus: 0.5
    networks: [backend]

  bitcoin-core:
    <<: [*restart, *security]
    build:
      context: ./infra/bitcoin
      args:
        BITCOIN_VERSION: '31.1'
    profiles: [bitcoin]
    environment:
      BITCOIN_CHAIN: ${BITCOIN_CHAIN:-regtest}
      BITCOIN_RPC_USER: miningrpc
      BITCOIN_WALLET_NAME: ${BITCOIN_WALLET_NAME:-mining-gateway}
      BITCOIN_PRUNE_MIB: ${BITCOIN_PRUNE_MIB:-100000}
    secrets: [bitcoin_rpc_password, bitcoin_wallet_passphrase]
    ports:
      - '127.0.0.1:${BITCOIN_RPC_PORT:-18443}:18443'
    volumes:
      - bitcoin_data:/bitcoin
    healthcheck:
      test:
        [
          CMD-SHELL,
          'case "$${BITCOIN_CHAIN:-regtest}" in mainnet) flag="" ;; testnet) flag="-testnet" ;; signet) flag="-signet" ;; regtest) flag="-regtest" ;; *) exit 1 ;; esac; bitcoin-cli $$flag -datadir=/bitcoin -rpcport=18443 getblockchaininfo >/dev/null',
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    stop_grace_period: 2m
    mem_limit: 4g
    cpus: 4
    networks: [backend]

  monerod:
    <<: [*restart, *security]
    build:
      context: ./infra/monero
      args:
        MONERO_VERSION: '0.18.5.1'
    profiles: [monero]
    environment:
      MONERO_NETWORK: ${MONERO_NETWORK:-stagenet}
    command:
      - monerod
      - --data-dir=/monero
      - --prune-blockchain
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=38081
      - --confirm-external-bind
      - --restricted-rpc
      - --non-interactive
    ports:
      - '127.0.0.1:38081:38081'
    volumes:
      - monero_data:/monero
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:38081/get_height >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 2m
    stop_grace_period: 2m
    mem_limit: 4g
    cpus: 4
    networks: [backend]

  monero-wallet-rpc:
    <<: [*restart, *security]
    build:
      context: ./infra/monero
      args:
        MONERO_VERSION: '0.18.5.1'
    profiles: [monero]
    entrypoint: [/usr/local/bin/wallet-entrypoint.sh]
    environment:
      MONERO_NETWORK: ${MONERO_NETWORK:-stagenet}
      MONERO_RPC_USER: miningrpc
      MONERO_WALLET_NAME: mining-gateway
      MONERO_BOOTSTRAP_WALLET: ${MONERO_BOOTSTRAP_WALLET:-false}
      MONERO_WALLET_RESTORE_HEIGHT: ${MONERO_WALLET_RESTORE_HEIGHT:-0}
    secrets: [monero_rpc_password, monero_wallet_passphrase]
    ports:
      - '127.0.0.1:38088:38088'
    volumes:
      - monero_wallet:/wallet
    depends_on:
      monerod:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl --digest -fsS -u miningrpc:$$(cat /run/secrets/monero_rpc_password) -H ''content-type: application/json'' -d ''{"jsonrpc":"2.0","id":"0","method":"get_version"}'' http://127.0.0.1:38088/json_rpc >/dev/null',
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: 1g
    cpus: 1
    networks: [backend]

  prometheus:
    <<: [*restart, *security]
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=30d,
      ]
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 1g
    cpus: 1
    networks: [backend]

  alertmanager:
    <<: [*restart, *security]
    image: prom/alertmanager:v0.30.0
    profiles: [observability]
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    mem_limit: 256m
    networks: [backend]

  loki:
    <<: [*restart, *security]
    image: grafana/loki:3.6.2
    profiles: [observability]
    command: [-config.file=/etc/loki/local-config.yaml]
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    mem_limit: 768m
    cpus: 1
    networks: [backend]

  alloy:
    <<: [*restart, *security]
    image: grafana/alloy:v1.11.3
    profiles: [observability]
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./infra/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki]
    mem_limit: 384m
    networks: [backend]

  grafana:
    <<: [*restart, *security]
    image: grafana/grafana:12.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    secrets: [grafana_admin_password]
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki]
    mem_limit: 512m
    networks: [backend]

  postgres-backup:
    <<: *security
    build: ./infra/backup
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: mining_gateway
      PGUSER: mining
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    secrets: [postgres_password]
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    networks: [backend]

secrets:
  postgres_password:
    file: ./secrets/postgres-password.txt
  redis_password:
    file: ./secrets/redis-password.txt
  bitcoin_rpc_password:
    file: ./secrets/bitcoin-rpc-password.txt
  bitcoin_wallet_passphrase:
    file: ./secrets/bitcoin-wallet-passphrase.txt
  monero_rpc_password:
    file: ./secrets/monero-rpc-password.txt
  monero_wallet_passphrase:
    file: ./secrets/monero-wallet-passphrase.txt
  grafana_admin_password:
    file: ./secrets/grafana-admin-password.txt

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  bitcoin_data:
  monero_data:
  monero_wallet:
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  backend:
    driver: bridge
